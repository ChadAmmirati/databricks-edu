# Ed-Fi resource manifest.
#
# Each entry describes one Ed-Fi endpoint to extract from the ODS/API and land
# as a Delta table in the bronze schema. The manifest is the single source of
# truth for what Bronze pulls and how Silver builds surrogate keys.
#
# Schema:
#   name:       snake_case name; used as the bronze table name ('students' -> bronze.students_raw)
#   path:       URL path under the data management API ('ed-fi/students')
#   namespace:  Ed-Fi namespace ('ed-fi' core, 'tpdm' teacher prep, ...)
#   key_paths:  full JSON paths (dot notation, validated against the Ed-Fi 7.3
#               OpenAPI spec) of the natural-key fields. Silver hashes these
#               (with tenant_code + api_year) into the dedupe surrogate key.
#               NEVER assume a key field is top-level: most Ed-Fi keys live
#               inside *Reference objects.
#   deletes:    pull the /deletes change-query endpoint for this resource
#               (default true; deletes are anti-joined out in Silver).
#   optional:   endpoint may be absent on a given ODS / Data Standard version
#               (e.g. 'parents' removed in DS 5.x, 'contacts' added in DS 5.x).
#               A 404 marks it skipped instead of failing the run.

