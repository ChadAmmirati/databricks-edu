[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-databricks"
version = "0.1.0"
description = "Databricks-native replacement for the Enable Data Union (EDU) Ed-Fi ingestion + warehouse pipeline."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pyspark>=3.5,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
